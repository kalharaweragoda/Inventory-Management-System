<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .sidebar { background-color: #3f51b5; color: white; min-height: 100vh; padding: 20px; }
        .main-content { padding: 40px; }
        
        /* Form Card Styling */
        .form-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 1500px;
            margin: 0 auto;
        }
        .form-control {
            border: 1px solid #ced4da;
            padding: 10px;
            border-radius: 8px;
        }
        .btn-save { background-color: #3f51b5; color: white; width: 100%; padding: 10px; font-weight: bold; }
        .btn-cancel { width: 100%; padding: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <h3>IMS</h3>
            <p>Overview</p>
        </div>

        <div class="col-md-10 main-content">
            <div class="form-card">
                <h2 class="mb-4 text-center">Add New Product</h2>
                
                <form method="post">
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted">{{ field.label }}</label>
                            {{ field }}
                        </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-save mt-3">Save Product</button>
                    <a href="{% url 'product_list' %}" class="btn btn-outline-secondary btn-cancel">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
